<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather APP</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <form class="search">
      <input type="text" placeholder="Enter city name" spellcheck="false" aria-label="City name" />
      <button type="submit" aria-label="Search weather">
        <img src="./search.png" alt="" />
      </button>
    </form>
    <div class="error" role="status">City not found</div>

    <div class="weather" aria-live="polite"> <!-- lowercase 'weather' -->
      <img src="./rain.png" class="weather-icon" alt="Weather Icon" />
      <h1 class="temp">22°C</h1>
      <h2 class="city">Bangalore</h2>

      <div class="details">
        <div class="col">
          <img src="./humidity.png" alt="Humidity" />
          <div>
            <p class="humidity">50%</p>
            <p>Humidity</p>
          </div>
        </div>
        <div class="col">
          <img src="./wind.png" alt="Wind Speed" />
          <div>
            <p class="wind">15 km/h</p> <!-- fixed class name -->
            <p>Wind Speed</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const proxyUrl = "./api/weather";
    const DEFAULT_CITY = "Bangalore"; // neutral documented default; no geolocation is requested

    const searchForm = document.querySelector(".search");
    const searchBox = document.querySelector(".search input");
    const searchBtn = document.querySelector(".search button");
    const weatherIcon = document.querySelector(".weather-icon");
    const errorBox = document.querySelector(".error");
    const weatherBox = document.querySelector(".weather");

    let requestInFlight = false;

    function showError(message) {
      errorBox.textContent = message;
      errorBox.style.display = "block";
      weatherBox.style.display = "none";
    }

    async function checkWeather(city) {
      if (requestInFlight) return; // one lookup at a time — extra submits while loading are ignored
      requestInFlight = true;
      searchBtn.disabled = true;

      try {
        const response = await fetch(proxyUrl + "?city=" + encodeURIComponent(city || DEFAULT_CITY));
        if (response.status === 404) {
          showError("City not found");
          return;
        }
        if (!response.ok) {
          // server/configuration errors come back generic from the proxy —
          // no provider payloads or metadata are ever shown here
          showError("Weather service is unavailable. Please try again.");
          return;
        }
        const data = await response.json();

        document.querySelector(".city").textContent = data.name;
        document.querySelector(".temp").textContent = Math.round(data.main.temp) + "°C";
        document.querySelector(".humidity").textContent = data.main.humidity + "%";
        document.querySelector(".wind").textContent = data.wind.speed + " km/h";

        const condition = data.weather[0].main;
        const mistConditions = ["Mist", "Fog", "Haze", "Smoke", "Dust", "Sand", "Ash"];

        if (condition === "Clouds") {
          weatherIcon.src = "./clouds.png";
        } else if (condition === "Clear") {
          weatherIcon.src = "./clear.png";
        } else if (condition === "Rain") {
          weatherIcon.src = "./rain.png";
        } else if (condition === "Drizzle") {
          weatherIcon.src = "./drizzle.png";
        } else if (mistConditions.includes(condition)) {
          weatherIcon.src = "./mist.png";
        } else if (condition === "Thunderstorm") {
          weatherIcon.src = "./rain.png"; // no dedicated thunderstorm asset — rain is the closest existing icon
        } else if (condition === "Snow") {
          weatherIcon.src = "./snow.png";
        } else {
          weatherIcon.src = "./clouds.png"; // fallback for any other condition (image exists)
        }
        weatherBox.style.display = "block";
      } catch {
        // network failure or malformed local fetch target — generic message
        showError("Weather service is unavailable. Please try again.");
      } finally {
        requestInFlight = false;
        searchBtn.disabled = false;
      }
    }

    searchForm.addEventListener("submit", (event) => {
      event.preventDefault(); // Enter submits the search without reloading the page
      checkWeather(searchBox.value);
    });

    checkWeather(DEFAULT_CITY);
  </script>
</body>
</html>
